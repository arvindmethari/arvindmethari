<svg width="100%" height="200" viewBox="0 0 800 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .bg { fill: #0d1117; }
      
      /* Base key styles */
      .white-key {
        fill: #161b22;
        stroke: #0d1117;
        stroke-width: 2;
        animation: keyPress 2.5s infinite ease-in-out;
      }
      
      .black-key {
        fill: #090d11;
        animation: keyPressBlack 2s infinite ease-in-out;
      }

      /* Staggered animation timings for random key presses */
      .k1  { animation-delay: 0.1s; }
      .k2  { animation-delay: 0.7s; }
      .k3  { animation-delay: 1.4s; }
      .k4  { animation-delay: 0.3s; }
      .k5  { animation-delay: 1.9s; }
      .k6  { animation-delay: 1.1s; }
      .k7  { animation-delay: 0.5s; }
      .k8  { animation-delay: 1.7s; }
      .k9  { animation-delay: 0.9s; }
      .k10 { animation-delay: 2.2s; }
      .k11 { animation-delay: 0.4s; }
      .k12 { animation-delay: 1.3s; }

      @keyframes keyPress {
        0%, 100% { fill: #161b22; opacity: 0.6; }
        50% { fill: #388bfd; opacity: 1; filter: drop-shadow(0px 0px 8px #388bfd); }
      }

      @keyframes keyPressBlack {
        0%, 100% { fill: #090d11; opacity: 0.8; }
        50% { fill: #1f6feb; opacity: 1; filter: drop-shadow(0px 0px 8px #1f6feb); }
      }

      /* Text styles */
      .title {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        font-size: 32px;
        font-weight: 700;
        fill: #ffffff;
        text-anchor: middle;
      }

      .subtitle {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        font-size: 16px;
        font-weight: 400;
        fill: #c9d1d9;
        text-anchor: middle;
      }

      .status {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        font-size: 14px;
        font-weight: 500;
        fill: #8b949e;
        text-anchor: middle;
      }
    </style>
  </defs>

  <!-- Background container -->
  <rect class="bg" width="800" height="200" />

  <!-- Animated Piano Keys Background -->
  <g opacity="0.45">
    <!-- White Keys -->
    <rect class="white-key k1"  x="0"   y="0" width="40" height="200" />
    <rect class="white-key k3"  x="40"  y="0" width="40" height="200" />
    <rect class="white-key k5"  x="80"  y="0" width="40" height="200" />
    <rect class="white-key k2"  x="120" y="0" width="40" height="200" />
    <rect class="white-key k7"  x="160" y="0" width="40" height="200" />
    <rect class="white-key k4"  x="200" y="0" width="40" height="200" />
    <rect class="white-key k9"  x="240" y="0" width="40" height="200" />
    <rect class="white-key k6"  x="280" y="0" width="40" height="200" />
    <rect class="white-key k11" x="320" y="0" width="40" height="200" />
    <rect class="white-key k8"  x="360" y="0" width="40" height="200" />
    <rect class="white-key k1"  x="400" y="0" width="40" height="200" />
    <rect class="white-key k10" x="440" y="0" width="40" height="200" />
    <rect class="white-key k3"  x="480" y="0" width="40" height="200" />
    <rect class="white-key k12" x="520" y="0" width="40" height="200" />
    <rect class="white-key k5"  x="560" y="0" width="40" height="200" />
    <rect class="white-key k2"  x="600" y="0" width="40" height="200" />
    <rect class="white-key k8"  x="640" y="0" width="40" height="200" />
    <rect class="white-key k4"  x="680" y="0" width="40" height="200" />
    <rect class="white-key k9"  x="720" y="0" width="40" height="200" />
    <rect class="white-key k6"  x="760" y="0" width="40" height="200" />

    <!-- Black Keys -->
    <rect class="black-key k2"  x="28"  y="0" width="24" height="120" />
    <rect class="black-key k4"  x="68"  y="0" width="24" height="120" />
    <rect class="black-key k9"  x="148" y="0" width="24" height="120" />
    <rect class="black-key k1"  x="188" y="0" width="24" height="120" />
    <rect class="black-key k6"  x="228" y="0" width="24" height="120" />
    <rect class="black-key k10" x="308" y="0" width="24" height="120" />
    <rect class="black-key k3"  x="348" y="0" width="24" height="120" />
    <rect class="black-key k7"  x="428" y="0" width="24" height="120" />
    <rect class="black-key k11" x="468" y="0" width="24" height="120" />
    <rect class="black-key k5"  x="508" y="0" width="24" height="120" />
    <rect class="black-key k12" x="588" y="0" width="24" height="120" />
    <rect class="black-key k8"  x="628" y="0" width="24" height="120" />
    <rect class="black-key k3"  x="708" y="0" width="24" height="120" />
    <rect class="black-key k7"  x="748" y="0" width="24" height="120" />
  </g>

  <!-- Content Overlay -->
  <text x="400" y="80" class="title">Hi, I'm Arvind 👋</text>
  <text x="400" y="115" class="subtitle">Computer Science &amp; Machine Learning Student</text>
  <text x="400" y="145" class="status">Ready To Learn More 🚀</text>
</svg>
